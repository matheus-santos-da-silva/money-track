# Rotação dos logs de cada container: no máximo 3 arquivos de 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  # ---- Infra ----
  kafka:
    logging: *logging
    image: confluentinc/cp-kafka:7.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:9092 1 20"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---- Banco do Users Service ----
  user-service-db:
    logging: *logging
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${USERS_DB_USER:?defina USERS_DB_USER no .env (veja .env.example)}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?defina USERS_DB_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: user-service-db
    ports:
      - "5433:5432"
    volumes:
      - users_service_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Users Service ----
  users-service:
    logging: *logging
    build: ./users-service
    environment:
      DATABASE_URL: postgres://${USERS_DB_USER}:${USERS_DB_PASSWORD}@user-service-db:5432/user-service-db
      KAFKA_URL: kafka:9092
      LOG_FORMAT: pretty
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./users-service:/app
    depends_on:
      user-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3002:3000"
    command: sh -c "yarn prisma generate && npx prisma migrate deploy && yarn start:dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  # ---- Banco do Finance Service ----
  finance-service-db:
    logging: *logging
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${FINANCE_DB_USER:?defina FINANCE_DB_USER no .env (veja .env.example)}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:?defina FINANCE_DB_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: finance-service-db
    ports:
      - "5434:5432"
    volumes:
      - finance_service_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Finance Service ----
  finance-service:
    logging: *logging
    build: ./finance-service
    environment:
      DATABASE_URL: postgres://${FINANCE_DB_USER}:${FINANCE_DB_PASSWORD}@finance-service-db:5432/finance-service-db
      KAFKA_URL: kafka:9092
      LOG_FORMAT: pretty
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./finance-service:/app
    depends_on:
      finance-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: sh -c "yarn prisma generate && npx prisma migrate deploy && yarn run seed && yarn start:dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  # ---- Observabilidade ----
  otel-collector:
    logging: *logging
    image: otel/opentelemetry-collector:0.164.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
      - prometheus

  prometheus:
    logging: *logging
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  tempo:
    logging: *logging
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  grafana:
    logging: *logging
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  kafka_data:
  users_service_db_data:
  finance_service_db_data:
  prometheus_data:
  tempo_data:
  grafana_data:
