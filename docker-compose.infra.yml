name: money-track-prod-local

# Rotação dos logs de cada container: no máximo 3 arquivos de 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  kafka:
    logging: *logging
    image: confluentinc/cp-kafka:7.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:9092 1 20"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  users-service-db:
    logging: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USERS_DB_USER:?defina USERS_DB_USER no .env (veja .env.example)}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?defina USERS_DB_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: users-service-db
    ports:
      - "5433:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-service:
    logging: *logging
    build: ./users-service
    environment:
      DATABASE_URL: postgres://${USERS_DB_USER}:${USERS_DB_PASSWORD}@users-service-db:5432/users-service-db
      KAFKA_URL: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
      TRUST_PROXY_HOPS: 0
    depends_on:
      users-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3002:3000"
    command: sh -c "npx prisma migrate deploy && yarn start:prod"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  finance-service-db:
    logging: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${FINANCE_DB_USER:?defina FINANCE_DB_USER no .env (veja .env.example)}
      POSTGRES_PASSWORD: ${FINANCE_DB_PASSWORD:?defina FINANCE_DB_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: finance-service-db
    ports:
      - "5434:5432"
    volumes:
      - finance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  finance-service:
    logging: *logging
    build: ./finance-service
    environment:
      DATABASE_URL: postgres://${FINANCE_DB_USER}:${FINANCE_DB_PASSWORD}@finance-service-db:5432/finance-service-db
      KAFKA_URL: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
      PORT: 3001
      TRUST_PROXY_HOPS: 0
    depends_on:
      finance-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: sh -c "npx prisma migrate deploy && yarn start:prod"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  kafka_data:
  users_db_data:
  finance_db_data:
