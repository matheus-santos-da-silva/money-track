stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          # Desde a 2.7 o padrão é localhost: sem isto, os outros containers não alcançam o receiver.
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    block_retention: 168h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
  processor:
    service_graphs:
      # O 1º atributo presente nomeia o nó de quem não é instrumentado (o banco); a instrumentação pg usa a semconv nova.
      peer_attributes: [peer.service, db.namespace, db.name]
      enable_messaging_system_latency_histogram: true

overrides:
  defaults:
    metrics_generator:
      # Só service-graphs: span-metrics duplicaria a latência HTTP que os serviços já medem.
      processors: [service-graphs]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
